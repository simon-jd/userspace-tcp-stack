# The runner's acceptance plan (M2-TASKS m2d-testbed test 5): Linux CUBIC and
# stack NewReno at 10 Mbit/s, 20 ms, 0 %, 2xBDP, 2 repetitions. The stack's
# NewReno runs in pairs with Linux reno (one netem seed and back to back);
# Linux CUBIC runs alone.
#   tools/m2/matrix.py run testbed/m2/plans/mini.toml --slot 0
campaign = "m2d-testbed/mini"
seed = 20261115
reps = 2

[[cell]]
bw = 10
rtt = 20
loss = 0
queue_bdp = 2

[[algo]]
cc = "newreno"
impls = ["utcp", "linux"]

[[algo]]
cc = "cubic"
impls = ["linux"]
